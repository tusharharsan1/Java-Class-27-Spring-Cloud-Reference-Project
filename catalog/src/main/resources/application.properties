spring.application.name=productcatalogservice

# Class 6: the Groq key stays OUTSIDE the code (environment variable)
groq.api-key=${GROQ_API_KEY}

# Class 7: MySQL. The password also comes from an environment variable.
spring.datasource.url=jdbc:mysql://localhost:3306/productcatalogservice
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Class 16: Flyway runs the files in db/migration. This database already exists, so call it version 1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Class 8: lazy loading problems show up while we code (not hidden by the open session)
spring.jpa.open-in-view=false

# Class 19: how to check a login token. The catalog never calls the auth service per request.
shopnest.auth.jwk-set-uri=${AUTH_JWKS_URL:http://localhost:8081/.well-known/jwks.json}
shopnest.auth.issuer=userauthservice
shopnest.auth.audience=shopnest-api

# Class 15: no outside call may wait forever
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=5s

# Class 15: where Groq lives (we can aim it at our pretend friend)
groq.url=${GROQ_URL:https://api.groq.com/openai/v1/chat/completions}

# Class 15: the circuit breaker for the Groq call
resilience4j.circuitbreaker.instances.groq.sliding-window-size=5
resilience4j.circuitbreaker.instances.groq.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.groq.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.groq.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.groq.permitted-number-of-calls-in-half-open-state=3
management.endpoints.web.exposure.include=health,circuitbreakers

# A refused request shows a clear reason (for example a sort field that is not allowed).
spring.mvc.problemdetails.enabled=true
# Meaning search: the free key for the numbers service (Google AI Studio). Never write the key in a file.
embedding.api-key=${GEMINI_API_KEY:}

# Class 25: Redis. Short timeouts: a slow cache is worse than no cache.
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.connect-timeout=200ms
spring.data.redis.timeout=200ms
spring.cache.type=redis
spring.cache.redis.time-to-live=10m
spring.cache.redis.key-prefix=shopnest:
management.endpoint.health.show-details=always

# Only the local classroom profile connects to Eureka.
eureka.client.enabled=false
