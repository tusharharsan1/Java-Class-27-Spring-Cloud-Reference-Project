# Use only on your laptop. A separate schema keeps the usual catalog data safe.
server.address=127.0.0.1
server.port=${SERVER_PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/shopnest_c27?createDatabaseIfNotExist=true}
groq.api-key=
embedding.api-key=
embedding.url=http://127.0.0.1:9090/v1beta
embedding.discover=true
spring.cache.type=none
search.lab-direct=true
spring.jpa.show-sql=false

# Class 27: register Catalog, and fetch the addresses of other services.
eureka.client.enabled=true
eureka.client.service-url.defaultZone=http://127.0.0.1:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Lab timings. These are shorter than production defaults.
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=15
eureka.client.registry-fetch-interval-seconds=5
